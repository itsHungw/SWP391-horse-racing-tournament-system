# Host nginx site for the API. Copy to /etc/nginx/sites-available/api and
# symlink into sites-enabled, then run:  sudo certbot --nginx -d api.yourdomain.com
# Certbot will ADD the TLS (443) server block + cert paths + the 80->443
# redirect automatically; you only maintain the HTTP block below.

server {
    listen 80;
    server_name api.yourdomain.com;

    # Allow uploads up to the backend's multipart limit (max-request-size 16MB).
    # nginx defaults to 1MB, which would 413 evidence/document uploads.
    client_max_body_size 16m;

    # gzip shrinks JSON payloads — a real win for clients far from Phoenix.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Forward the REAL client IP + scheme. The backend's rate-limiter
        # (APP_RATE_LIMIT_TRUSTED_PROXIES) and VNPay (vnp_IpAddr) depend on this;
        # without it every request looks like it came from nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}
