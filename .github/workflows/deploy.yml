name: Deploy backend

# Push to main -> run tests -> build an amd64 image -> push to GHCR -> SSH to
# the DigitalOcean droplet and roll it out. The frontend deploys itself via Vercel's own
# GitHub integration, so it is intentionally not part of this workflow.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests (native, fast)
        working-directory: backend
        run: ./mvnw -B verify

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR requires lowercase)
        id: img
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # DigitalOcean droplets are amd64 — same arch as the GitHub runner, so no
      # QEMU emulation is needed and the build is fast. (If you ever move to an
      # ARM host like Oracle Ampere, switch platforms to linux/arm64.)
      - name: Build & push (linux/amd64 for the DigitalOcean droplet)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Roll out over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/hrts
            git pull --ff-only
            docker compose -f docker-compose.prod.yml --env-file infra/.env.prod pull
            docker compose -f docker-compose.prod.yml --env-file infra/.env.prod up -d
            docker image prune -f
