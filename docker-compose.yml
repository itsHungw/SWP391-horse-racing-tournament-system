# Local development stack: PostgreSQL + MinIO (S3-compatible).
# Pairs a local database with a local object store so developers never touch the
# shared cloud bucket. Usage:
#   cp .env.example .env   (adjust if needed)
#   docker compose up -d
# Then run the backend with SPRING_PROFILES_ACTIVE=dev.

services:
  postgres:
    image: postgres:17
    container_name: hrts-postgres
    environment:
      # The official image auto-creates POSTGRES_DB on first start with this
      # user as owner, so no separate db-init step is needed.
      POSTGRES_DB: "${DB_NAME:-horseracing}"
      POSTGRES_USER: "${DB_USERNAME:-horseracing}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-local123}"
    ports:
      # Postgres default port. Point the backend's DB_URL at localhost:5432.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-horseracing} -d ${DB_NAME:-horseracing}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: hrts-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${OBJECT_STORAGE_SECRET_KEY:-minioadmin}"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data

  # Creates the dev bucket once MinIO is up.
  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    environment:
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-horseracing-dev}"
      OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}"
      OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:-minioadmin}"
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$OBJECT_STORAGE_ACCESS_KEY" "$$OBJECT_STORAGE_SECRET_KEY"; do
          echo "waiting for minio..."; sleep 2;
        done;
        mc mb --ignore-existing local/"$$OBJECT_STORAGE_BUCKET";
        echo "minio bucket $$OBJECT_STORAGE_BUCKET ready"

volumes:
  postgres-data:
  minio-data:
