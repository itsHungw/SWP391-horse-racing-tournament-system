spring:
  datasource:
    url: jdbc:h2:mem:backend-tests;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: false

aws:
  s3:
    bucket-name: test-private-bucket
    region: ap-southeast-1
    presigned-url-ttl: 5m

app:
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
    allow-credentials: true
  security:
    content-security-policy: "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    rate-limit:
      enabled: true
      window-seconds: 60
      login-limit: 1000
      upload-limit: 1000
      prediction-submit-limit: 1000
      forgot-password-limit: 1000
      forgot-password-window-seconds: 900
      reset-password-limit: 1000
      reset-password-window-seconds: 900
      cache-maximum-size: 50000
      cache-ttl-seconds: 1200
      trusted-proxies:
  upload:
    root: target/test-uploads
  auth:
    jwt-secret: test-secret-test-secret-test-secret-test-secret
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    email-otp-ttl-minutes: 10
    password-reset-token-ttl-minutes: 10
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
