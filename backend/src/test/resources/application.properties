spring.datasource.url=jdbc:h2:mem:backend-tests;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
app.auth.jwt-secret=test-secret-test-secret-test-secret-test-secret
app.auth.access-token-ttl-minutes=15
app.auth.refresh-token-ttl-days=7
app.auth.email-token-ttl-hours=24
app.auth.password-reset-token-ttl-minutes=30
app.auth.refresh-cookie-name=refresh_token
app.auth.refresh-cookie-secure=false
app.auth.refresh-cookie-same-site=Lax
