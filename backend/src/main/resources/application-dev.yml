spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

# Local development points at the MinIO container from docker-compose.yml.
# A real OBJECT_STORAGE_BUCKET / OBJECT_STORAGE_ENDPOINT can still override these via env.
storage:
  s3:
    bucket-name: ${OBJECT_STORAGE_BUCKET:horseracing-dev}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:minioadmin}
