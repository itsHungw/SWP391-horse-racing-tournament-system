spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Local development points at the MinIO container from docker-compose.yml.
# A real AWS_S3_BUCKET / AWS_S3_ENDPOINT can still override these via env.
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:horseracing-dev}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    access-key: ${AWS_S3_ACCESS_KEY:minioadmin}
    secret-key: ${AWS_S3_SECRET_KEY:minioadmin}
