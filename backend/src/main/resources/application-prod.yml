app:
  auth:
    refresh-cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
    refresh-cookie-same-site: Strict

# Behind the host nginx: trust X-Forwarded-* so the app sees the real client IP
# and the https scheme (used by rate-limiting, VNPay vnp_IpAddr, and cookies).
server:
  forward-headers-strategy: native

# Object storage is driven entirely by env vars (see application.yml):
#   OBJECT_STORAGE_ENDPOINT / OBJECT_STORAGE_ACCESS_KEY / OBJECT_STORAGE_SECRET_KEY / OBJECT_STORAGE_BUCKET / OBJECT_STORAGE_REGION
# - Cloudflare R2 / MinIO / any S3-compatible store: set endpoint + static keys.
# - The current VPS target uses Cloudflare R2.
