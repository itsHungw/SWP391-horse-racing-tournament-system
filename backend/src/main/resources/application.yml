spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        TimeZone: UTC
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${APP_FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 16MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

aws:
  s3:
    # bucket-name has no default on purpose: a missing AWS_S3_BUCKET must fail
    # fast instead of silently writing to a shared/wrong bucket. Each environment
    # supplies its own bucket (see application-dev.yml / application-prod.yml).
    bucket-name: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-southeast-1}
    presigned-url-ttl: ${AWS_S3_PRESIGNED_URL_TTL:5m}
    # endpoint + static credentials are only set for S3-compatible local storage
    # (MinIO). Left blank in prod so the AWS SDK uses the real AWS endpoint and
    # the instance IAM role.
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/wallet/vnpay/return}
  frontend-return-url: ${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/wallet}
  min-amount: ${VNPAY_MIN_AMOUNT:10000}
  max-amount: ${VNPAY_MAX_AMOUNT:50000000}

wallet:
  withdrawal:
    enabled: ${WALLET_WITHDRAWAL_ENABLED:true}
    min-amount: ${WALLET_WITHDRAWAL_MIN_AMOUNT:50000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
    allow-credentials: true
  security:
    content-security-policy: "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    rate-limit:
      enabled: ${APP_RATE_LIMIT_ENABLED:true}
      window-seconds: ${APP_RATE_LIMIT_WINDOW_SECONDS:60}
      login-limit: ${APP_RATE_LIMIT_LOGIN:10}
      upload-limit: ${APP_RATE_LIMIT_UPLOAD:20}
      prediction-submit-limit: ${APP_RATE_LIMIT_PREDICTION:30}
      forgot-password-limit: ${APP_RATE_LIMIT_FORGOT_PASSWORD:3}
      forgot-password-window-seconds: ${APP_RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:900}
      reset-password-limit: ${APP_RATE_LIMIT_RESET_PASSWORD:10}
      reset-password-window-seconds: ${APP_RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:900}
      cache-maximum-size: ${APP_RATE_LIMIT_CACHE_MAXIMUM_SIZE:50000}
      cache-ttl-seconds: ${APP_RATE_LIMIT_CACHE_TTL_SECONDS:1200}
      trusted-proxies: ${APP_RATE_LIMIT_TRUSTED_PROXIES:}
  upload:
    root: ${APP_UPLOAD_ROOT:uploads}
    horse-image-max-bytes: 5242880
    horse-evidence-max-bytes: 10485760
  auth:
    jwt-secret: ${AUTH_JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    email-otp-ttl-minutes: 10
    password-reset-token-ttl-minutes: 10
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    refresh-cookie-same-site: Lax
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@equinepro.local}

# Swagger UI tuned for the end-to-end business-flow demo: numbered tags sort in
# flow order, the JWT "Authorize" token survives page reloads, groups start collapsed.
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true
    doc-expansion: none
    display-request-duration: true
