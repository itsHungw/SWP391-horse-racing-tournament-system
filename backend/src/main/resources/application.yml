spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        TimeZone: UTC
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        # Gom lazy ToOne/collection load thành IN-query thay vì một-query-mỗi-parent (lưới đỡ N+1).
        default_batch_fetch_size: 100
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${APP_FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 16MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

storage:
  s3:
    # bucket-name has no default on purpose: a missing OBJECT_STORAGE_BUCKET must fail
    # fast instead of silently writing to a shared/wrong bucket. Each environment
    # supplies its own bucket (see application-dev.yml / application-prod.yml).
    bucket-name: ${OBJECT_STORAGE_BUCKET}
    region: ${OBJECT_STORAGE_REGION:ap-southeast-1}
    presigned-url-ttl: ${OBJECT_STORAGE_PRESIGNED_URL_TTL:5m}
    # endpoint + static credentials are set for S3-compatible storage
    # (MinIO locally, Cloudflare R2 in production).
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/wallet/vnpay/return}
  frontend-return-url: ${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/wallet}
  min-amount: ${VNPAY_MIN_AMOUNT:10000}
  max-amount: ${VNPAY_MAX_AMOUNT:50000000}

wallet:
  withdrawal:
    enabled: ${WALLET_WITHDRAWAL_ENABLED:true}
    min-amount: ${WALLET_WITHDRAWAL_MIN_AMOUNT:50000}
    risk:
      velocity-count: ${WALLET_WITHDRAWAL_RISK_VELOCITY_COUNT:3}
      velocity-window: ${WALLET_WITHDRAWAL_RISK_VELOCITY_WINDOW:24h}
      anomaly-multiplier: ${WALLET_WITHDRAWAL_RISK_ANOMALY_MULTIPLIER:2.0}
      anomaly-min-history: ${WALLET_WITHDRAWAL_RISK_ANOMALY_MIN_HISTORY:3}
      recent-terminal-window: ${WALLET_WITHDRAWAL_RISK_RECENT_TERMINAL_WINDOW:7d}
      history-window: ${WALLET_WITHDRAWAL_RISK_HISTORY_WINDOW:90d}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
    allow-credentials: true
  security:
    content-security-policy: "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; frame-src https://www.youtube-nocookie.com; img-src 'self' https://i.ytimg.com data:"
    rate-limit:
      enabled: ${APP_RATE_LIMIT_ENABLED:true}
      window-seconds: ${APP_RATE_LIMIT_WINDOW_SECONDS:60}
      login-limit: ${APP_RATE_LIMIT_LOGIN:10}
      upload-limit: ${APP_RATE_LIMIT_UPLOAD:20}
      prediction-submit-limit: ${APP_RATE_LIMIT_PREDICTION:30}
      forgot-password-limit: ${APP_RATE_LIMIT_FORGOT_PASSWORD:3}
      forgot-password-window-seconds: ${APP_RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:900}
      reset-password-limit: ${APP_RATE_LIMIT_RESET_PASSWORD:10}
      reset-password-window-seconds: ${APP_RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:900}
      cache-maximum-size: ${APP_RATE_LIMIT_CACHE_MAXIMUM_SIZE:50000}
      cache-ttl-seconds: ${APP_RATE_LIMIT_CACHE_TTL_SECONDS:1200}
      trusted-proxies: ${APP_RATE_LIMIT_TRUSTED_PROXIES:}
  upload:
    root: ${APP_UPLOAD_ROOT:uploads}
    horse-image-max-bytes: 5242880
    horse-evidence-max-bytes: 10485760
  prediction:
    # Pari-mutuel house takeout for single-race pools (EXACT_POSITION, HEAD_TO_HEAD).
    takeout-rate: ${APP_PREDICTION_TAKEOUT:0.15}
    # Single end-margin for streak parlays (applied once to multiplied fair odds).
    streak-takeout: ${APP_PREDICTION_STREAK_TAKEOUT:0.20}
    # Safety caps (VND for money, multiplier for odds).
    min-wager: ${APP_PREDICTION_MIN_WAGER:10000}
    max-wager: ${APP_PREDICTION_MAX_WAGER:50000000}
    max-total-odds: ${APP_PREDICTION_MAX_TOTAL_ODDS:100}
    max-payout: ${APP_PREDICTION_MAX_PAYOUT:1000000000}
    # Display-only provisional odds (the live line). Settlement uses the real pool, not these.
    display-seed: ${APP_PREDICTION_DISPLAY_SEED:40000000}
    max-display-odds: ${APP_PREDICTION_MAX_DISPLAY_ODDS:50}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    email-otp-ttl-minutes: 10
    password-reset-token-ttl-minutes: 10
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    refresh-cookie-same-site: Lax
    google-client-id: ${GOOGLE_CLIENT_ID:}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@equinepro.local}

# Actuator: expose only the health endpoint (with liveness/readiness probes) so
# nginx/uptime checks and the docker-compose healthcheck can hit /actuator/health.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Swagger UI tuned for the end-to-end business-flow demo: numbered tags sort in
# flow order, the JWT "Authorize" token survives page reloads, groups start collapsed.
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true
    doc-expansion: none
    display-request-duration: true
