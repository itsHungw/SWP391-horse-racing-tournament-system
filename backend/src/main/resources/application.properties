spring.application.name=backend


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB

app.auth.jwt-secret=${AUTH_JWT_SECRET:change-me-in-real-env-change-me-in-real-env}
app.auth.access-token-ttl-minutes=15
app.auth.refresh-token-ttl-days=7
app.auth.email-otp-ttl-minutes=10
app.auth.password-reset-token-ttl-minutes=30
app.auth.refresh-cookie-name=refresh_token
app.auth.refresh-cookie-secure=false
app.auth.refresh-cookie-same-site=Lax

app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@equinepro.local}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
